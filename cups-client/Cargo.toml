[package]
name = "cups-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Async pure-Rust IPP client for CUPS: printers, jobs, supplies and drivers"
keywords = ["cups", "printing", "ipp", "printer", "async"]
categories = ["network-programming", "os::linux-apis"]
repository.workspace = true
readme = "README.md"
rust-version = "1.93"

[dependencies]
ipp.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.49", default-features = false, features = ["time"] }
async-stream = "0.3"

[dev-dependencies]
tokio = { version = "1.49", default-features = false, features = ["macros", "rt"] }
