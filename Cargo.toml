[workspace]
members = ["ipp-async", "cups-pk-client"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dahankzter/ipp-client"
edition = "2024"

[workspace.dependencies]
# TEMPORARY: a fork carrying three changes proposed upstream as
# ancwrd1/ipp.rs#68, #69 and #70. Subscriptions cannot work without #70 -
# the parser rejects a subscription group outright. Drop this for the
# published crates.io release, which needs those merged and released.
ipp = { git = "https://github.com/dahankzter/ipp.rs", branch = "all-three", default-features = false, features = ["async-client"] }
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
tokio = { version = "1.49", features = ["full"] }
futures = "0.3"
thiserror = "2.0"
tracing = "0.1"

[profile.release]
lto = "thin"
